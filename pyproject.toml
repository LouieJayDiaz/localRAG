[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localrag"
version = "0.1.0"
description = "A local document chat website"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
localrag-ingest = "localrag.cli:main"
localrag = "localrag.web:main"
localrag-desktop = "localrag.desktop_launcher:main"

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
desktop = ["pywebview>=5.4"]
build = ["pyinstaller>=6.0"]
rag = ["chromadb>=0.5"]
local-embeddings = ["chromadb>=0.5", "fastembed>=0.4"]
documents = ["pypdf>=5.0", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0"]
images = ["Pillow>=10.0", "pytesseract>=0.3.10"]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localrag = ["web/*"]
